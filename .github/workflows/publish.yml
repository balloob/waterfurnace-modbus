name: Publish to PyPI

on:
  release:
    types: [published]
  # A dropped release webhook must not leave a tag published on GitHub but
  # absent from PyPI, with no way to recover but re-cutting the release.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (e.g. 4.0.1)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@v6
      - name: Set package version from release tag
        run: sed -i "s/^version = \"0\\.0\\.0\"$/version = \"${RELEASE_TAG}\"/" pyproject.toml
      - name: Verify the version was substituted
        run: grep -qx "version = \"${RELEASE_TAG}\"" pyproject.toml
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
